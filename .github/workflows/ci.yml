name: Cell-grid clone API
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  library:
    name: Library (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt
      - name: Formatting
        run: cargo +1.92.0 fmt --all --check
      - name: Library tests
        run: cargo +1.92.0 test --locked --lib -- --test-threads=2
